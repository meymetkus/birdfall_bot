name: Amazon Price Tracker

on:
  schedule:
    - cron: '*/5 * * * *'  # Her 5 dakikada bir otomatik çalışır
  workflow_dispatch:      # Elle çalıştırma butonu ekler

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Çek
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 playwright
          playwright install chromium --with-deps

      - name: Botu Çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
- name: Hafızayı Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bildirilenler.txt
          git commit -m "Bildirilen ürünler güncellendi" || exit 0
          git push
